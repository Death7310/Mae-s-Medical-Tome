name: Build Android APK

on:
  push:
    branches: [main, claude/cross-platform-book-slides-app-93fq8v]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build web app for packaging (served from the app's own origin)
        run: npm run build
        env:
          VITE_BASE: /
      - run: npx cap sync android
      - name: Use the release keystore from secrets when present
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
            echo "TOME_KEYSTORE=../keystore/release.jks" >> "$GITHUB_ENV"
            echo "TOME_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "TOME_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "TOME_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets"
          else
            echo "Using the committed development keystore (android/keystore/dev-release.jks)"
          fi
      - name: Assemble signed release APK
        working-directory: android
        env:
          TOME_VERSION_CODE: ${{ github.run_number }}
          TOME_VERSION_NAME: 0.1.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../maes-medical-tome.apk
          ls -la ../maes-medical-tome.apk
      - uses: actions/upload-artifact@v4
        with:
          name: maes-medical-tome-apk
          path: maes-medical-tome.apk
      - name: Publish as the "latest" release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Android / Huawei APK, build ${{ github.run_number }} from commit ${{ github.sha }}.

          Install: open this file on the phone and allow installation from this source when asked. Works on Huawei phones without Google services. Installing a newer build over an older one keeps your data, as long as both were signed with the same key."
          if gh release view apk-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload apk-latest maes-medical-tome.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit apk-latest --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
          else
            gh release create apk-latest maes-medical-tome.apk --title "Android app (latest build)" --notes "$NOTES" --latest --repo "$GITHUB_REPOSITORY"
          fi
          echo "APK: https://github.com/$GITHUB_REPOSITORY/releases/latest/download/maes-medical-tome.apk"
